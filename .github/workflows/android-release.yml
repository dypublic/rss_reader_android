name: Build Signed Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name written into the APK, for example 0.1.0
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$REQUESTED_VERSION_NAME"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version name: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "name=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "ANDROID_KEYSTORE_BASE64 is missing" >&2; exit 1; }
          [[ -n "$KEYSTORE_PASSWORD" ]] || { echo "ANDROID_KEYSTORE_PASSWORD is missing" >&2; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "ANDROID_KEY_ALIAS is missing" >&2; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "ANDROID_KEY_PASSWORD is missing" >&2; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rss-reader-release.jks"
          chmod 600 "$RUNNER_TEMP/rss-reader-release.jks"

      - name: Test and build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rss-reader-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/rss-reader-${VERSION_NAME}-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "dist/rss-reader-${VERSION_NAME}-release.apk" \
            > dist/SIGNING_CERT.txt
          cd dist
          sha256sum "rss-reader-${VERSION_NAME}-release.apk" > SHA256SUMS.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-${{ steps.version.outputs.name }}-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/rss-reader-${VERSION_NAME}-release.apk" \
              dist/SHA256SUMS.txt \
              dist/SIGNING_CERT.txt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/rss-reader-${VERSION_NAME}-release.apk" \
              dist/SHA256SUMS.txt \
              dist/SIGNING_CERT.txt \
              --verify-tag \
              --title "RSS Reader ${VERSION_NAME}" \
              --generate-notes \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rss-reader-release.jks"
